app:
  name: medicore
  env: dev          # dev / prod；prod 下 gin 切换 ReleaseMode
  port: 8080

log:
  level: info       # debug / info / warn / error

mysql:
  host: 127.0.0.1
  port: 3306
  user: medicore
  password: ""      # 生产环境用 MEDICORE_MYSQL_PASSWORD 覆盖，不要写进文件
  database: medicore
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1h

redis:
  addr: 127.0.0.1:6379
  password: ""      # 生产环境用 MEDICORE_REDIS_PASSWORD 覆盖
  db: 0
  pool_size: 20

# ============================================================================
# 密钥一律不写入仓库。
#
# 开发环境：运行 `go run ./cmd/genlocal` 生成 configs/config.local.yaml，
#           该文件已被 .gitignore 排除，程序启动时会自动合并它。
# 生产环境：通过环境变量注入
#           MEDICORE_SECURITY_AES_KEY / _PHONE_PEPPER / _JWT_SECRET
#
# 这三个值一旦泄露的后果：
#   aes_key      泄露 -> 全部病历与手机号明文泄露
#   phone_pepper 泄露 -> 可用彩虹表反推手机号
#   jwt_secret   泄露 -> 可伪造任意用户（含管理员）的令牌
# ============================================================================
security:
  aes_key: ""
  phone_pepper: ""
  jwt_secret: ""
  jwt_issuer: medicore
  access_token_ttl: 2h      # spec §2.2
  refresh_token_ttl: 168h   # 7 天
  bcrypt_cost: 10           # 不得低于 10

# 定时任务周期（cron 表达式）。可用环境变量覆盖，
# 例如压测时把对账周期缩短：MEDICORE_SCHEDULER_STOCK_RECONCILE="@every 10s"
scheduler:
  expire_scan: "@every 1m"      # 释放超时未确认的预约
  stock_reconcile: "@every 5m"  # 以 MySQL 为准校准 Redis 号源
  his_sync: "@every 1h"          # 从模拟 HIS 同步基础数据

# AI 预问诊上游。
# 当前仅 mock 可用（决策 #3：先用 Mock 降级，不依赖外部配额）；
# 配置 openai/dashscope/deepseek 会在启动时明确报错，而不是静默回退到 mock。
llm:
  provider: mock
  timeout: 30s          # 单次上游调用超时
  mock:
    delta_delay_ms: 20  # 每段增量的间隔，模拟打字机
    # 结构化总结的返回模式，用于验证降级路径：
    #   valid | invalid_json | invalid_schema | error | timeout
    summary_mode: valid
    stream_error_at: 0  # >0 时在第 N 段后注入流式错误
