# =============================================================================
# golangci-lint 配置（v2 格式）
#
# 设计原则：**只启用已被实测证明为 0 告警的那一套**。
#
# 为什么这么保守：本项目此前手工跑的是 `go vet` + `staticcheck` + `deadcode`，
# 三者均为 0。`errcheck`、`gocritic`、`revive` 这些从未跑过 ——
# 一次性全开会得到一片红，然后为了"跑绿"去写一堆 `//nolint`，
# 那等于把 lint 变成噪音源，比不开还糟。
#
# 加严的正确顺序：先跑一次候选 linter 看它到底报什么，
# 逐条判定"是真问题还是风格偏好"，再决定启用与抑制，而不是先启用后补救。
#
# 版本要求：version: "2" 对应 golangci-lint v2.x（本机实测 v2.13.2，
# 由 go1.27.1 构建，与项目 Go 版本一致）。
# v1 用的是 `linters-settings` / `issues.exclude-rules` 那套字段，**互不兼容**。
# 本地一键入口：`nub run backend:lint`。
# =============================================================================
version: "2"

run:
  # 与 `nub run backend:test` 一致：不加 -tags=integration。
  # 集成测试需要真实的 MySQL/Redis，不应进入静态检查链路。
  timeout: 5m
  tests: true

linters:
  # none + 显式 enable，而不是 standard：
  # 这样"启用了哪些"是这里读得出来的，不会随 golangci-lint 版本升级悄悄变多。
  default: none
  enable:
    # go vet 的**默认**分析器集合 —— 与 `nub run backend:vet`（`go vet ./...`）完全一致。
    # 刻意不用 enable-all，原因见下面的 settings.govet。
    - govet
    # 静态检查：SA*（bug）/ S*（简化）/ ST*（风格）/ QF*（快速修复）
    - staticcheck
    # 赋值后从未被读取的变量 —— 典型的"改了但没生效"
    - ineffassign
    # 未被引用的标识符。与 `deadcode` 目标重叠但实现不同，
    # 两者互补：deadcode 基于可达性，unused 基于引用计数。
    - unused

  settings:
    govet:
      # ⚠️ 刻意**不开** enable-all。它会把两个非默认分析器一起打开，
      # 而两者在本项目上都是纯噪音（实测记录如下）：
      #
      #   shadow          —— 实测报 14 条，**全是**
      #                      `if err := f(); err != nil { ... }` 与块内 `:=`。
      #                      这是 Go 的惯用写法，作用域被刻意收窄；
      #                      逐条核对过三处 `:=`（appointment.go:126、
      #                      auth.go:121、loadtest/main.go:102），
      #                      外层 err 之后都没有被复用，不存在"吞掉错误"。
      #                      shadow 本身也不在 `go vet` 的默认集合里。
      #   fieldalignment  —— 要求按字段大小重排 struct 省 padding。
      #                      DTO 的字段顺序是按语义分组排的，
      #                      为几个字节把 `Status` 挪到 `Diagnosis` 前是纯亏损。
      #
      # 列在这里是为了让后来者想开 enable-all 时先看到这段。
      disable:
        - shadow
        - fieldalignment

    staticcheck:
      # 全部检查器，**不做任何排除**。
      #
      # 曾经这里排除了 ST1000 / ST1003 / ST1016 / ST1020-1022（都是注释与命名风格）。
      # 后来实测了一遍：ST* 一共只报 11 条，且全是真实的文档缺口 ——
      # `internal/middleware` 整包缺包注释（8 条 ST1000），
      # 外加 3 处导出标识符的注释没以标识符名开头。已全部修掉，于是排除项一并删除。
      #
      # 结论：**先看它报什么，再决定要不要抑制**。当初若直接写上排除，
      # 这 8 个包的文档缺口就会永远留在"已抑制"的名单里。
      checks:
        - all

  exclusions:
    # 生成的/不可修改的文件
    generated: lax

formatters:
  # 只启用 gofmt —— 与 `nub run backend:fmt`（`gofmt -l -w`）保持完全一致。
  # 不启用 goimports/gci：它们会按自己的分组规则重排 import，
  # 而本项目的 import 分组是人手排的（标准库 / 第三方 / 本项目），改动只会造成噪音。
  #
  # 实测确认 formatter **会**被 `golangci-lint run` 一并检查（不是只走 `fmt` 命令）：
  # 故意写一个 `func f( a int ) int` 的探测文件后，`run` 报出
  # `2 issues: * gofmt: 1 * unused: 1` 并以非 0 退出。
  # 也就是说 CI 里只跑 `run` 就够，不必再加一条 `fmt --diff`。
  enable:
    - gofmt
