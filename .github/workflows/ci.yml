name: CI

# 分四个互相独立的关卡，按「反馈速度」排序：
#   static → unit/race → integration → fuzz / vuln
# 前面挂掉时后面的没有必要跑，所以用 needs 串起来；
# fuzz 与 vuln 较慢且与本轮代码改动关系较弱，并行跑不影响主线反馈。
#
# static 关卡的内容：gofmt → go vet → golangci-lint → deadcode。
# 前两条不需要额外安装、秒级返回，所以放在最前面；后两条要 go install，放后面。

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GOTELEMETRY: off

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：最快，任何失败都应在这里先暴露
  # ---------------------------------------------------------------------------
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # gofmt 必须作为**检查**而不是格式化：CI 里改文件没有意义，
      # 要的是"提交前忘了格式化"这件事被拦住。
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./test)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # golangci-lint 取代了原先单独的 staticcheck 步骤：
      # 它的 staticcheck 检查器就是同一个引擎、同样的 `checks: all`，
      # 跑两遍只是多花一次 CI 时间。
      #
      # 版本**必须固定**：用 @latest 会让 CI 因为上游发版而变红，
      # 而这类红与本次改动无关，只会训练人"重跑一次"。本机实测 v2.13.2、0 issues。
      # 配置在仓库根 `.golangci.yml`（v2 格式，与 v1 不兼容）。
      - name: golangci-lint
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...

      # deadcode 与 golangci-lint 的 unused 是**两种不同算法**，互为补充：
      #   unused   基于引用计数（包内视角）
      #   deadcode 基于可达性（从 main/测试入口出发，能抓到整条调用链的死亡）
      # 所以这一条保留，不是重复。
      - name: deadcode
        working-directory: backend
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          deadcode -test ./...

  # ---------------------------------------------------------------------------
  # 单元测试 + 数据竞争检测
  # ---------------------------------------------------------------------------
  unit:
    name: 单元测试（含 -race）
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -race 在 ubuntu runner 上是免费的：镜像自带 gcc，cgo 直接可用。
      # 这也正是本机（Windows，无 C 编译器）做不到、必须靠 CI 补上的那一环。
      - name: go test -race
        working-directory: backend
        run: go test -race -count=1 ./...

      - name: 覆盖率
        working-directory: backend
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  # ---------------------------------------------------------------------------
  # 集成测试（真实 MySQL + Redis）
  # ---------------------------------------------------------------------------
  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: static

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: medicore
          MYSQL_USER: medicore
          MYSQL_PASSWORD: medicore123
        ports:
          - 3306:3306
        # 关键：健康检查必须用**真实查询**，不能用 mysqladmin ping。
        # docker-entrypoint 初始化时会先起一个临时 server，此时 ping 已经返回成功，
        # 但最终 server 还没就绪 —— 用 ping 判断会随机拿到 "driver: bad connection"。
        # （这个坑是本地开发时踩出来的，见 AGENTS.md §5.1。）
        options: >-
          --health-cmd="mysql -umedicore -pmedicore123 -e 'SELECT 1' medicore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      MEDICORE_MYSQL_PASSWORD: medicore123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 仓库里不含任何密钥（连开发用的也没有），所以必须先生成本地密钥。
      # config.Validate() 会按特征拒绝可预测的密钥，跳过这一步集成测试起不来。
      - name: 生成本地密钥
        working-directory: backend
        run: go run ./cmd/genlocal

      # 集成测试会自建 medicore_test 库并执行 docs/schema.sql，
      # 所以 DDL 每次都会在 CI 里被真正跑一遍。
      - name: 集成测试
        working-directory: backend
        run: go test -tags=integration -count=1 ./test/integration/...

  # ---------------------------------------------------------------------------
  # Fuzz：每个目标短时运行，守住解析器不 panic、不越界
  # ---------------------------------------------------------------------------
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 目标由脚本从源码里发现，不维护硬编码列表 ——
      # 新增 fuzz 目标时忘了加进列表，等于白写。
      # CI 上用较短时长（回归语料已入库，长跑留给本地/定时任务）。
      - name: fuzz（每目标 20s）
        run: bash backend/scripts/fuzz.sh 20s

  # ---------------------------------------------------------------------------
  # 依赖漏洞扫描
  # ---------------------------------------------------------------------------
  vuln:
    name: 依赖漏洞
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ---------------------------------------------------------------------------
  # 前端（脚手架阶段：只做类型检查、lint 与构建）
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # nub 是独立二进制，不是 npm 包。
      # 传显式版本号有两个作用：可复现，以及**跳过脚本里那次 GitHub API 调用**
      # （匿名调用在共享 IP 的 runner 上很容易撞 60 次/小时的限流返回 403）。
      - name: 安装 nub
        run: |
          export NUB_INSTALL_DIR="$RUNNER_TEMP/nub"
          export NUB_NO_MODIFY_PATH=1
          curl -fsSL https://raw.githubusercontent.com/nubjs/nub/main/install.sh | bash -s 0.9.0
          echo "$NUB_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: 安装依赖
        run: nub --cwd frontend install

      - name: 类型检查
        run: nub run frontend:typecheck

      - name: Lint
        run: nub run frontend:lint

      - name: 构建
        run: nub run frontend:build
