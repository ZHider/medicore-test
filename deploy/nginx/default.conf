# MediCore 前端站点配置（spec §11.2：nginx 同时托管静态资源与反代 /api）。
#
# 三个不能改错的地方：
#   1. `proxy_buffering off` —— 预问诊对话是 text/event-stream。
#      开着缓冲时 nginx 会把整段响应攒完再一次性下发，
#      前端的"打字机"会退化成"转圈很久然后全文出现"。
#   2. SPA history 回退 —— 前端用 createWebHistory，直接访问 /appointments
#      或刷新页面时，nginx 必须回退到 index.html，否则 404。
#   3. `X-Forwarded-For` 用 `$remote_addr` **覆盖**而不是 `$proxy_add_x_forwarded_for` 追加。
#      后端按客户端 IP 做登录限流（5 次/分钟），而 gin 默认信任所有代理并取
#      XFF 的第一个值。若这里用追加，客户端自带 `X-Forwarded-For: 1.2.3.4`
#      就能伪造来源、绕开限流。

# 后端在 compose 网络里的服务名
upstream medicore_backend {
    server backend:8080;
    # 与下面的 `Connection ""` 配合，复用与后端的长连接
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。配合 proxy_pass 使用变量，让后端重建（换 IP）后
    # nginx 能在 valid 周期内自动重新解析 —— 否则会一直 502 到 nginx 重启。
    # 这是本地反复 `up --build` 时最常见的坑。
    resolver 127.0.0.11 valid=10s ipv6=off;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ------------------------------------------------------------------
    # 静态资源
    # ------------------------------------------------------------------

    # Vite 产物带内容哈希，可以长缓存。
    #
    # 两个细节：
    #   1. 不用 `expires 1y` —— 它会**另外**再发一条 `Cache-Control: max-age=...`，
    #      导致同一条响应里出现两个 Cache-Control 头。浏览器能处理，
    #      但排查缓存问题时两个互相矛盾的值会让人怀疑人生。
    #   2. 不加 `always` —— 否则 404 也会带上"缓存一年"，
    #      而 `try_files $uri =404` 恰好会走到那条分支，等于把 404 永久缓存住。
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存：发版后它引用的 assets 文件名会变，
    # 缓存住旧壳会让用户一直请求已经不存在的 JS。
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ------------------------------------------------------------------
    # 后端反向代理
    # ------------------------------------------------------------------

    # 运维端点：不在 /api 下，免认证。
    # 注意 /metrics 会暴露接口调用量等运行信息；演示环境直接开放，
    # 生产环境应在此处加 allow/deny 或 basic auth。
    location ~ ^/(healthz|readyz|metrics)$ {
        set $ops_upstream http://medicore_backend;
        proxy_pass $ops_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        set $api_upstream http://medicore_backend;
        # 变量形式的 proxy_pass 不会剥离 location 前缀，
        # 因此必须显式带上 $request_uri（后端期望完整路径 /api/v1/...）
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加，理由见文件头第 3 条
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ---- SSE 关键配置（spec §11.2）----
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # nginx 默认会为压缩而缓冲上游响应；SSE 场景必须关掉
        gzip off;
    }

    # ------------------------------------------------------------------
    # SPA 回退：必须放在最后
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
