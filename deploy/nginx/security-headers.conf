# 公共安全响应头。
#
# 为什么单独一个文件：nginx 的 `add_header` 在 location 里是**替换**语义而非继承 ——
# 只要某个 location 自己写了任何一条 add_header，server 级的那几条就全部失效。
# 因此每个自带 add_header 的 location 都必须显式 include 本文件，
# 否则那些路径（例如 /assets/、/index.html）会**静默**丢掉这几个头，
# 而这类缺失在浏览器里完全看不出异常。
#
# `always` 表示错误响应（4xx/5xx）也带上这些头。

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer-when-downgrade always;
